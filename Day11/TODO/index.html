<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>To-Do List</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6f8;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:520px;
    background:white;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
}

h1{
    font-size:52px;
    margin-bottom:25px;
    font-weight:700;
}

.input-box{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

input{
    flex:1;
    padding:14px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:18px;
    outline:none;
}

input:focus{
    border-color:#1f7cff;
}

.add-btn{
    padding:0 22px;
    border:none;
    background:#0d6efd;
    color:white;
    font-size:18px;
    border-radius:10px;
    cursor:pointer;
}

.add-btn:hover{
    background:#0b5ed7;
}

.remove-btn{
    width:100%;
    padding:15px;
    background:#4e6168;
    color:white;
    border:none;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
    margin-bottom:20px;
}

.remove-btn:hover{
    background:#405159;
}

ul{
    list-style:none;
    margin-bottom:18px;
}

li{
    padding:12px;
    border-bottom:1px solid #eee;
    font-size:18px;
}

.counter{
    font-size:20px;
}
</style>

</head>
<body>

<div class="container">

    <h1>To-Do List</h1>

    <div class="input-box">
        <input type="text" id="task" placeholder="Add a new task...">
        <button class="add-btn" onclick="addTask()">Add</button>
    </div>

    <button class="remove-btn" onclick="removeLastTask()">
        Remove Last Task
    </button>

    <ul id="list"></ul>

    <p class="counter">
        <span id="count">0</span> task(s) remaining
    </p>

</div>

<script>
    const taskInput = document.getElementById("task");
    const list = document.getElementById("list");
    const count = document.getElementById("count");

    function updateCount(){
        count.textContent = list.children.length;
    }

    function addTask(){
        const text = taskInput.value.trim();

        if(text==="") return;

        const li = document.createElement("li");
        li.textContent = text;

        list.appendChild(li);

        taskInput.value="";
        updateCount();
    }

    function removeLastTask(){
        if(list.lastElementChild){
            list.removeChild(list.lastElementChild);
            updateCount();
        }
    }

    taskInput.addEventListener("keypress",function(e){
        if(e.key==="Enter"){
            addTask();
        }
    });

    updateCount();
</script>

</body>
</html>
