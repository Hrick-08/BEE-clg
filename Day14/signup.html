<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f4f4;
        }

        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">

            <div class="col-md-5">
                <div class="card shadow">
                    <div class="card-body">

                        <h3 class="text-center mb-4">Sign Up Page</h3>

                        <form id="studentForm" onsubmit="handleSubmit(event)">

                            <input type="text" id="name" class="form-control mb-3" placeholder="Enter Name" required>

                            <input type="email" id="email" class="form-control mb-3" placeholder="Enter Email" required>

                            <input type="text" id="password" class="form-control mb-3" placeholder="Enter Password"
                                required>

                            <button class="btn btn-primary w-100">
                                Submit
                            </button>

                        </form>

                    </div>
                </div>
            </div>

        </div>

        <!-- Local Storage Display -->
        <div class="row justify-content-center mt-5">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header">
                        <h4>Local Storage</h4>
                    </div>
                    <div class="card-body">
                        <pre id="storage"></pre>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>

        let users_array = [];

        function showLocalStorage() {
            let data = localStorage.getItem("users");

            if (data) {
                document.getElementById("storage").textContent =
                    JSON.stringify(JSON.parse(data), null, 2);
            } else {
                document.getElementById("storage").textContent =
                    "No users in localStorage";
            }
        }

        window.onload = showLocalStorage;

        function handleSubmit(event) {

            event.preventDefault();

            let form = document.getElementById("studentForm");

            let user = {
                name: document.getElementById("name").value,
                email: document.getElementById("email").value,
                pass: document.getElementById("password").value
            };

            let users_data = localStorage.getItem("users");

            if (users_data == null) {
                users_array = [];
            } else {
                users_array = JSON.parse(users_data);
            }

            let emailExists = users_array.some(
                u => u.email === user.email
            );

            if (emailExists) {

                alert("User already exists. Please login.");

                showLocalStorage();

                // Uncomment to redirect
                // window.location.href = "login.html";

                return;
            }

            users_array.push(user);

            localStorage.setItem(
                "users",
                JSON.stringify(users_array)
            );

            form.reset();

            showLocalStorage();

            // Uncomment to redirect
            // window.location.href = "login.html";
        }

    </script>

</body>

</html>
