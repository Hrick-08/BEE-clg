<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Number</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-card {
            width: 400px;
        }

        #message {
            min-height: 25px;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="card shadow p-4 game-card">
    <div class="text-center">

        <h2>🎮 Guess the Number</h2>
        <p class="text-muted">Guess a number between <strong>1</strong> and <strong>10</strong></p>

        <input
            type="number"
            id="guess"
            class="form-control mb-3"
            placeholder="Enter Number"
            min="1"
            max="10">

        <div class="d-grid gap-2">
            <button class="btn btn-primary" onclick="checkGuess()">Check</button>
            <button class="btn btn-secondary" onclick="newGame()">New Game</button>
        </div>

        <p id="message" class="mt-3"></p>

    </div>
</div>

<script>
let randomNumber = Math.floor(Math.random() * 10) + 1;

function checkGuess() {
    const guess = Number(document.getElementById("guess").value);
    const message = document.getElementById("message");

    if (!guess || guess < 1 || guess > 10) {
        message.className = "text-danger mt-3";
        message.textContent = "Please enter a number between 1 and 10.";
        return;
    }

    if (guess === randomNumber) {
        message.className = "text-success mt-3";
        message.textContent = "🎉 Correct! You guessed it.";
    } else if (guess < randomNumber) {
        message.className = "text-warning mt-3";
        message.textContent = "Too Low!";
    } else {
        message.className = "text-warning mt-3";
        message.textContent = "Too High!";
    }
}

function newGame() {
    randomNumber = Math.floor(Math.random() * 10) + 1;
    document.getElementById("guess").value = "";
    document.getElementById("message").textContent = "";
}
</script>

</body>
</html>
