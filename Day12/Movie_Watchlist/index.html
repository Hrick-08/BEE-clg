<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        #container {
            display: flex;
            justify-content: center;
            margin-top: 40px;
        }
    </style>
</head>

<body>
    <div id="container">
        <div class="card" style="width: 500px;">
            <div class="card-body">
                <h3>🎥 Movie Wishlist 🍿</h3>
                <div class="input-group flex-nowrap">
                    <input type="text" class="form-control" placeholder="movie..." aria-label="Username" id="songvalue"
                        aria-describedby="addon-wrapping">
                </div>
                <div style="margin-top: 20px;">
                    <button type="button" onclick="addsong()" class="btn btn-primary btn-sm">Add Movie</button>
                    <button type="button" class="btn btn-warning btn-sm" onclick="addFav()">Add Favourite</button>
                </div>
                <div id="player" style="margin-top: 20px; width:100%">
                    
                </div>
                <div id="player2" style="margin-top: 20px; width:100%">
                    
                </div>
            </div>
        </div>
    </div>
    <script>
        let songs = ["Avatar", "Dhurandhar"];
        let favs = [];

        let player = document.getElementById("player");
        let songInp =  document.getElementById("songvalue")

        let addsong = () =>{
            songs.push(songInp.value);
            renderSongs();
        }

        let addFav = () =>{
            favs.push(songInp.value);
            renderFavs();
        }

        let deleteSong=(idx) =>{
            songs.splice(idx,1);
            renderSongs();
        }

        let deleteFav=(idx) =>{
            favs.splice(idx,1);
            renderFavs();
        }

        let renderSongs = () => {
            player.innerHTML =""
            songs.forEach((el, idx) => {
                player.innerHTML += `
                <div style="display:flex">
                    <p style="border-bottom: 1px solid black; width:100%">${idx + 1}. ${el}</p>
                    <button onclick="deleteSong(${idx})" style="border: none; background: none; cursor: pointer; font-size: 20px; margin-bottom: 10px">🗑️</button>
                </div>
                `
            })
        }
        renderSongs();

        let renderFavs = () => {
            player2.innerHTML =""
            favs.forEach((el, idx) => {
                player2.innerHTML += `
                <div style="display:flex">
                    <p style="border-bottom: 1px solid black; width:100%">${idx + 1}. ${el}</p>
                    <button onclick="deleteFav(${idx})" style="border: none; background: none; cursor: pointer; font-size: 20px; margin-bottom: 10px">🗑️</button>
                </div>
                `
            })
        }
        renderFavs();

    </script>
    <!-- <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script> -->
</body>

</html>
